name: Deploy to EC2

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_IP: ${{ secrets.EC2_INSTANCE_IP }}
  EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Install frontend dependencies and build
      - name: Install frontend dependencies
        run: |
          cd frontend/
          npm install
          npm run build

      # Configure AWS credentials (if needed)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Build Docker images (docker-compose.yml inside docker folder)
      - name: Build Docker images
        run: |
          docker-compose -f docker/docker-compose.yml build

      # Prepare deployment script
      - name: Prepare deployment script
        run: |
          cat << EOF > deploy.sh
          #!/bin/bash
          set -e
          docker-compose -f docker/docker-compose.yml down
          docker-compose -f docker/docker-compose.yml up -d
          docker image prune -f
          EOF
          chmod +x deploy.sh

      # Transfer docker-compose.yml and deploy.sh to EC2 using SCP action
      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.EC2_INSTANCE_IP }}
          username: ec2-user
          key: ${{ env.EC2_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.yml,deploy.sh"
          target: "/home/ec2-user/"

      # Deploy on EC2 via SSH
      - name: Execute deployment script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_INSTANCE_IP }}
          username: ec2-user
          key: ${{ env.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Install Docker if not present
            if ! [ -x "$(command -v docker)" ]; then
              echo "Docker not found, installing Docker..."
              sudo yum update -y
              sudo yum install -y docker
              sudo service docker start
              sudo usermod -aG docker ec2-user
              sudo chmod 666 /var/run/docker.sock
            else
              sudo service docker start
            fi

            # Install Docker Compose if not present
            if ! [ -x "$(command -v docker-compose)" ]; then
              echo "Docker Compose not found, installing now..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            cd /home/ec2-user
            chmod +x deploy.sh
            ./deploy.sh


      # Run Django migrations on EC2 (assuming container named 'backend')
      - name: Run Database Migrations on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_INSTANCE_IP }}
          username: ec2-user
          key: ${{ env.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker exec -i $(docker ps -qf "name=backend") python manage.py makemigrations
            docker exec -i $(docker ps -qf "name=backend") python manage.py migrate
