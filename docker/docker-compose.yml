services:
  backend:
    build:
      context: ../docker/backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000

  frontend:
    build:
      context: ../docker/frontend
      dockerfile: /dockerfile
    ports:
      - "5173:5173"
    command: npm run preview -- --host

