version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/dockerfile
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/dockerfile
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules   # ✅ Optional, more on this below
    ports:
      - "5173:5173"
    command: npm run dev -- --host       # ✅ IMPORTANT: Add --host so Vite works in container
volumes:
  node_modules: {}
